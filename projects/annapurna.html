<!-- Map styles -->
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<section class="mapwrap" style="margin:2rem 0">
  <div id="map" style="height:60vh;min-height:420px;border-radius:8px"></div>
</section>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
  const MAPTILER_KEY = "blcNGuPM8YRJyLOpy5al";
  const ROUTE_URL = "../img/project_content/annapurna_circuit/annapurna_simple.geojson"; // adjust if needed

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        basemap: {
          type: "raster",
          tiles: [
            `https://api.maptiler.com/maps/hybrid/256/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`
          ],
          tileSize: 256,
          maxzoom: 20
        },
        terrain: {
          type: "raster-dem",
          tiles: [
            `https://api.maptiler.com/tiles/terrain-rgb/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`
          ],
          tileSize: 256,
          encoding: "mapbox",
          maxzoom: 14
        },
        route: { type: "geojson", data: ROUTE_URL }
      },
      layers: [{ id: "basemap", type: "raster", source: "basemap" }],
      terrain: { source: "terrain", exaggeration: 1.3 }
    },
    center: [84.35, 28.52],  // tweak to your route's midpoint if needed
    zoom: 10,               // increase for closer start
    pitch: 45,
    hash: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

  map.on("load", () => {
    map.addLayer({
      id: "route-line",
      type: "line",
      source: "route",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#fbe16d", "line-width": 6 }
    });
  });
</script>
